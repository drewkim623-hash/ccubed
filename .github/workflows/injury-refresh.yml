# Refresh injury return estimates between the weekly builds.
#
# consensus.mjs reconciles the audit (injury-returns.json) with Sleeper/ESPN
# projections and the DraftKings props signal, build-injuries.mjs rewrites the
# snapshot the site reads, and injury-returns.mjs adds the return dates back.
#
# Cron is UTC and does not follow daylight saving, so each slot is listed for
# both EDT and EST and the gate below lets through only the one that lands
# within 30 minutes of the intended New York time (GitHub often starts
# scheduled runs 10-30+ minutes late; the paired slots are 60 minutes apart,
# so 30 still lets only one of each pair through):
#   09:20 every day, 18:20 Monday and Thursday, 11:50 and 15:50 Sunday.
#
# The odds are computed in the browser from index.html and these files, so the
# refreshed injuries are read back off the site into data/odds-snapshot.json
# (build-odds-snapshot.mjs only writes that file; it never sends) and the line
# history.

name: Injury refresh

on:
  schedule:
    - cron: "20 13,14 * * *"          # 09:20 EDT / 09:20 EST
    - cron: "20 22,23 * * 1,4"        # Mon/Thu 18:20 EDT / EST
    - cron: "50 15,16,19,20 * * 0"    # Sun 11:50 and 15:50, EDT / EST
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run everything but skip the commit and push"
        required: false
        type: boolean
        default: true

permissions:
  contents: write
  actions: read   # gh run list: skip while a weekly-data run is going (Sundays)

# Shared with sleeper-poll.yml: both write the same files and push to main.
# weekly-data.yml keeps its own group so a queued poll can never cancel a
# pending weekly-data run (GitHub keeps one pending run per group); the Sunday
# gate above skips while weekly-data is queued or running.
concurrency:
  group: sleeper-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Gate on New York local time
        id: gate
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "go=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          read -r dow hh mm <<< "$(TZ=America/New_York date '+%u %H %M')"
          now=$((10#$hh * 60 + 10#$mm))
          targets="560"                                   # 09:20 any day
          if [ "$dow" = 1 ] || [ "$dow" = 4 ]; then targets="$targets 1100"; fi  # 18:20 Mon/Thu
          if [ "$dow" = 7 ]; then targets="$targets 710 950"; fi                 # 11:50, 15:50 Sun
          go=false
          for t in $targets; do
            d=$((now - t)); [ $d -lt 0 ] && d=$((-d))
            if [ $d -le 30 ]; then go=true; fi
          done
          echo "New York $hh:$mm (day $dow): go=$go"
          # Sundays: weekly-data (11:30 ET) also writes injuries.json and pushes.
          # Its concurrency group stays separate on purpose, so instead skip this
          # run while a weekly-data run is in progress or queued.
          if [ "$go" = true ] && [ "$dow" = 7 ]; then
            running=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow weekly-data.yml --status in_progress --json databaseId --jq length)
            queued=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow weekly-data.yml --status queued --json databaseId --jq length)
            if [ "$((${running:-0} + ${queued:-0}))" -gt 0 ]; then
              echo "::notice::weekly-data is in progress ($running) or queued ($queued); skipping this injury refresh."
              go=false
            fi
          fi
          echo "go=$go" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ github.token }}

      - if: steps.gate.outputs.go == 'true'
        uses: actions/checkout@v7

      - if: steps.gate.outputs.go == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: "20"

      # Always exits 0; a feed that fails falls back to data/consensus-cache/.
      - name: Reconcile the injury consensus
        if: steps.gate.outputs.go == 'true'
        run: node consensus.mjs

      - name: Refresh the injury snapshot
        if: steps.gate.outputs.go == 'true'
        run: node build-injuries.mjs

      # After the snapshot on purpose, as in weekly-data.yml: build-injuries.mjs
      # rewrites injuries.json without the return fields, so they are added back here.
      - name: Estimate injury return dates
        if: steps.gate.outputs.go == 'true'
        run: node injury-returns.mjs

      # After projections (build-injuries.mjs), before the odds are read.
      - name: Price each roster against the ones it fielded
        if: steps.gate.outputs.go == 'true'
        run: node build-roster-weeks.mjs || echo "::warning::roster weeks not updated"

      - name: Install the browser for the odds snapshot
        if: steps.gate.outputs.go == 'true'
        run: |
          npm ci
          npx playwright install --with-deps chromium

      # Writes data/odds-snapshot.json and nothing else; it never sends.
      - name: Snapshot what the site is showing
        if: steps.gate.outputs.go == 'true'
        run: node build-odds-snapshot.mjs

      - name: Add this run's odds reading to the line history
        if: steps.gate.outputs.go == 'true'
        run: node build-odds-history.mjs || echo "::warning::odds history not updated"

      # So the next sleeper-poll.yml run does not redo this one's work.
      - name: Record the Sleeper fingerprint
        if: steps.gate.outputs.go == 'true'
        run: node sleeper-fingerprint.mjs --write

      - name: Commit anything that changed
        if: steps.gate.outputs.go == 'true' && !(github.event_name == 'workflow_dispatch' && inputs.dry_run)
        run: |
          git config user.name  "ccubed-data[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          commit() {
            git add -A data injuries.json injury-returns.json injury-returns-cache.json \
              data/odds-snapshot.json data/odds-history.json data/sleeper-fingerprint.json
            if git diff --staged --quiet; then return 1; fi
            git commit -m "Data: injury refresh"
          }
          if ! commit; then
            echo "Nothing changed."
            exit 0
          fi
          # No force push. If the rebase fails (weekly-data or the poll pushed
          # meanwhile): abort, reset to the new origin, rerun the build steps
          # above, recommit, and try pull --rebase + push once more; then give up.
          branch="${GITHUB_REF_NAME:-main}"
          if git pull --rebase origin "$branch" && git push origin "HEAD:$branch"; then exit 0; fi
          git rebase --abort 2>/dev/null || true
          echo "::warning::Rebase or push failed; regenerating on top of origin/$branch and retrying once."
          git fetch origin "$branch"
          git reset --hard "origin/$branch"
          node consensus.mjs
          node build-injuries.mjs
          node injury-returns.mjs
          node build-roster-weeks.mjs || echo "::warning::roster weeks not updated"
          node build-odds-snapshot.mjs
          node build-odds-history.mjs || echo "::warning::odds history not updated"
          node sleeper-fingerprint.mjs --write
          if ! commit; then
            echo "Nothing changed after regenerating."
            exit 0
          fi
          if git pull --rebase origin "$branch" && git push origin "HEAD:$branch"; then exit 0; fi
          git rebase --abort 2>/dev/null || true
          echo "::error::Could not rebase the injury commit onto $branch after one regenerate-and-retry; nothing pushed."
          exit 1
